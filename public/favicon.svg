<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFFAFE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Phantom Health Sparkle Star -->
  <g filter="url(#glow)" transform="translate(256, 256)">
    <!-- Central Sparkle -->
    <path d="M 0,-130 Q 0,-25 105,0 Q 0,25 0,130 Q 0,25 -105,0 Q 0,-25 0,-130 Z" fill="url(#sparkle)"/>
    <!-- Small Top-Right Companion Sparkle -->
    <path d="M 95,-105 Q 95,-65 135,-45 Q 95,-25 95,15 Q 95,-25 55,-45 Q 95,-65 95,-105 Z" fill="#22D3EE"/>
  </g>
</svg>
